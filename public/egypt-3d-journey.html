<style>
/* Layout: fixed 1080x1920 frame scaled to fit; 3D canvas, a 2D effects canvas for sand gusts, cartouche cards, captions, stamp and sound button on top. */
:root{
  --ink:#16233a;
  --muted:#4f5d70;
  --royal:#2a4fd6;
  --teal:#14a19c;
  --green:#3a9e57;
  --orange:#ff6a13;
  --gold:#d4a23c;
  --gold-hi:#f1cf7a;
  --paper:rgba(252,246,232,.92);
  --glass:rgba(252,248,238,.6);
  --display:"Marcellus", "Trajan Pro", Georgia, serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1222}
body{font-family:var(--body);color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:#f0dfbf}
#shake{position:absolute;inset:0}
#shake.hit{animation:shake .42s cubic-bezier(.3,.7,.4,1)}
@keyframes shake{0%{transform:none}15%{transform:translate(-14px,10px) rotate(-.35deg)}30%{transform:translate(12px,-8px) rotate(.3deg)}50%{transform:translate(-7px,5px)}70%{transform:translate(4px,-3px)}100%{transform:none}}
#c,#fx{position:absolute;inset:0;width:1080px;height:1920px;display:block}
#fx{pointer-events:none}
#sunglow{position:absolute;left:-200px;right:-200px;top:-520px;height:1100px;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:radial-gradient(circle at 70% 52%,rgba(255,236,190,1) 0,rgba(255,210,140,.8) 7%,rgba(255,170,100,.35) 22%,rgba(255,150,90,0) 48%)}

/* cartouche cards: frosted glass framed in gold */
.card{position:absolute;left:60px;right:60px;background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);
  border:3px solid var(--gold);border-radius:48px;
  box-shadow:inset 0 0 0 7px rgba(255,255,255,.55), inset 0 0 0 9px var(--gold-hi), 0 30px 70px -30px rgba(10,16,34,.6);

.card.hide{opacity:0;transform:translateY(-16px)}
#top{top:84px;padding:40px 48px 36px}
.kicker{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8a6a24}
.dot{width:16px;height:16px;border-radius:50%;background:var(--orange);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,106,19,.55)}70%{box-shadow:0 0 0 18px rgba(255,106,19,0)}100%{box-shadow:0 0 0 0 rgba(255,106,19,0)}}
.title{font-family:var(--display);font-size:64px;line-height:1.05;margin:14px 0 6px;color:var(--ink)}
.title span{color:var(--royal)}
.sub{font-size:27px;color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:26px}
.stat{background:rgba(255,255,255,.62);border-radius:26px;padding:20px 22px 18px;display:flex;flex-direction:column;gap:4px;border:1.5px solid rgba(212,162,60,.35)}
.stat b{font-weight:800;font-size:80px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat b small{font-size:34px;color:var(--muted);font-weight:700;letter-spacing:0}
.stat span{font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.stat:nth-child(1) span{color:var(--royal)}
.stat:nth-child(2) span{color:var(--teal)}
.stat:nth-child(3) span{color:var(--green)}
.passport{display:flex;gap:10px;margin-top:22px;align-items:center}
.passport em{font-style:normal;font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8a6a24;margin-right:6px}
.mini{width:42px;height:42px;border-radius:50%;border:2.5px dashed rgba(79,93,112,.45);display:grid;place-items:center;font-size:17px;font-weight:800;color:rgba(79,93,112,.6)}
.mini.on{border:3px solid var(--ink-c);color:var(--ink-c);background:rgba(255,255,255,.85);transform:rotate(var(--r));animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(1.8) rotate(var(--r))}to{transform:scale(1) rotate(var(--r))}}

#bottom{bottom:92px;padding:36px 48px 40px}
#bottom.swap .inner{opacity:0;transform:translateY(14px)}
.inner{transition:opacity .35s ease, transform .35s ease}
.dayno{font-size:26px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--orange)}
.dayname{font-family:var(--display);font-size:70px;line-height:1.05;margin:8px 0 22px;color:var(--ink);text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{font-size:27px;font-weight:700;padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.78);color:var(--ink);border:1.5px solid rgba(42,79,214,.2)}
.chip:nth-child(3n+2){border-color:rgba(20,161,156,.32)}
.chip:nth-child(3n){border-color:rgba(58,158,87,.32)}
.chip.num{font-size:30px;min-width:64px;text-align:center;padding:12px 0}

#hook{position:absolute;left:0;right:0;top:300px;text-align:center;color:#fff;pointer-events:none;text-shadow:0 6px 40px rgba(60,30,0,.6);transition:opacity .45s ease}
#hook .h1{font-family:var(--display);font-size:118px;line-height:1}
#hook .h2{font-size:32px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;margin-top:22px}

#cap{position:absolute;left:70px;right:70px;top:1196px;text-align:center;pointer-events:none;transition:opacity .3s ease}

  -webkit-box-decoration-break:clone;box-decoration-break:clone}
#cap.hide{opacity:0}

#stamp{position:absolute;left:50%;top:880px;width:500px;height:500px;margin:-250px 0 0 -250px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:var(--paper);color:var(--sc);border:9px solid var(--sc);outline:3px solid var(--sc);outline-offset:-26px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.45);opacity:0;pointer-events:none;transform:scale(.6)}

#stamp.out{animation:fadeout .45s ease forwards}
@keyframes slam{0%{opacity:0;transform:scale(2.6) rotate(-24deg)}55%{opacity:1}100%{opacity:1;transform:scale(1) rotate(var(--sr))}}
@keyframes fadeout{from{opacity:1;transform:scale(1) rotate(var(--sr))}to{opacity:0;transform:scale(.85) rotate(var(--sr)) translateY(-40px)}}
#stamp .s1{font-size:26px;font-weight:800;letter-spacing:.3em;text-transform:uppercase}
#stamp .s2{font-family:var(--display);font-size:86px;line-height:.95;margin:14px 24px;text-transform:uppercase}
#stamp .s3{font-size:26px;font-weight:800;letter-spacing:.24em;text-transform:uppercase}
#stamp .rule{width:240px;height:4px;background:var(--sc);margin:6px 0;border-radius:2px}

#flare{position:absolute;left:0;top:0;width:600px;height:600px;margin:-300px 0 0 -300px;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:radial-gradient(circle,rgba(255,250,225,1) 0,rgba(255,214,120,.55) 14%,rgba(255,180,80,.18) 38%,rgba(255,170,70,0) 62%),linear-gradient(90deg,transparent 0,rgba(255,240,200,.9) 50%,transparent 100%) center/100% 5px no-repeat,linear-gradient(0deg,transparent 0,rgba(255,240,200,.9) 50%,transparent 100%) center/5px 100% no-repeat}

#sound{position:absolute;left:50%;top:1060px;transform:translateX(-50%);font:800 34px var(--body);letter-spacing:.06em;
  color:#fff;background:var(--orange);border:0;border-radius:999px;padding:26px 52px;cursor:pointer;box-shadow:0 20px 50px -16px rgba(255,106,19,.8);z-index:5}
#sound:focus-visible{outline:4px solid #fff;outline-offset:4px}
#err{position:absolute;left:64px;right:64px;top:50%;font-size:30px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#shake.hit{animation:none}}
</style>

  let tot=0; const seg=[];
  for(let i=0;i<pts.length-1;i++){const l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);seg.push(l);tot+=l;}
  let d=clamp(u)*tot;

const fx=document.getElementById('fx').getContext('2d');
const GUST_N=420, gust=[]; for(let i=0;i<GUST_N;i++)gust.push([Math.random(),Math.random(),.5+Math.random(),2+Math.random()*7,Math.random()]);
const gustTimes=[...Array(9)].map((_,i)=>dayStart(i)-.35).concat([OUTRO-.35]);
function drawGust(t){
  fx.clearRect(0,0,W,H);
  let u=-1; for(const g of gustTimes){const k=(t-g)/.9; if(k>=0&&k<=1){u=k;break;}}
  if(u<0)return;
  const front=lerp(-500,W+500,u), a=Math.sin(Math.PI*u);
  const grd=fx.createLinearGradient(front-520,0,front+220,0);
  grd.addColorStop(0,'rgba(232,196,130,0)'); grd.addColorStop(.6,`rgba(232,196,130,${.55*a})`); grd.addColorStop(.85,`rgba(246,222,170,${.75*a})`); grd.addColorStop(1,'rgba(246,222,170,0)');
  fx.fillStyle=grd; fx.fillRect(0,0,W,H);
  for(const [px,py,sp,len,sh] of gust){
    const x=front-500+px*700*sp, y=py*H+Math.sin(py*40+u*6)*30;
    fx.fillStyle=`rgba(${sh<.5?'214,170,100':'250,232,190'},${(.35+sh*.5)*a})`;

}

const $=id=>document.getElementById(id);
const topCard=$('top'), botCard=$('bottom'), hook=$('hook'), stampEl=$('stamp'), shakeEl=$('shake'), capEl=$('cap'), capText=$('capText');
const sunglow=$('sunglow'), flareEl=$('flare');
const minis=DAYS.map((d,i)=>{const e=document.createElement('span');e.className='mini';e.textContent=i+1;
  e.style.setProperty('--ink-c',INKS[i%3]);e.style.setProperty('--r',((i%2?1:-1)*(6+i*2))+'deg');$('passport').appendChild(e);return e;});
const disp={a:0,b:0,c:0};
let shownPhase=null, stampState=-1, capShown=-1;
function setBottom(no,name,items,cls){
  botCard.classList.add('swap');
  setTimeout(()=>{
    $('dayno').textContent=no; $('dayname').textContent=name;
    $('chips').replaceChildren(...items.map((s,i)=>{const e=document.createElement('span');e.className='chip'+(cls?cls(i):'');e.textContent=s;return e;}));
    botCard.classList.remove('swap');

function overlay(t,dt){
  hook.classList.toggle('hide',!(t>.25&&t<2.5));
  const cardsOn=t>2.9&&t<59.0;
  topCard.classList.toggle('hide',!cardsOn); botCard.classList.toggle('hide',!cardsOn);
  const phase = t<DAY0 ? -1 : t<OUTRO ? Math.floor((t-DAY0)/DAYLEN) : (t<56.7?9:10);
  if(phase!==shownPhase){
    shownPhase=phase;
    if(phase===-1) setBottom('9 days · 8 nights','Cairo to Aswan',['6 to 15 guests','Egyptologist guide all 9 days','4★ hotels','All meals included']);
    else if(phase===9) setBottom('Your turn','Which day would you pick?',['1','2','3','4','5','6','7','8','9','Comment below'],i=>i<9?' num':'');
    else if(phase===10) setBottom('April 2027 · Limited to 15 guests','DM me EGYPT for the full itinerary',['Founding rate from $2,360','Small group, all inclusive'],null);
    else setBottom('Day '+(phase+1)+' of 9',DAYS[phase].n,DAYS[phase].items);
  }
  const tgt = phase<0 ? [0,0,0] : phase>8 ? [9,5,31] : [phase+1,CITIES[phase],HIGHS[phase]];
  if(t>59.4||t<.5){disp.a=disp.b=disp.c=0;}
  const k=Math.min(1,dt*3.2);
  disp.a+=(tgt[0]-disp.a)*k; disp.b+=(tgt[1]-disp.b)*k; disp.c+=(tgt[2]-disp.c)*k;
  $('s1').firstChild.nodeValue=String(Math.round(disp.a));
  $('s2').firstChild.nodeValue=String(Math.round(disp.b));
  $('s3').textContent=String(Math.round(disp.c));
  let st=-1;
  for(let i=0;i<9;i++){ if(t>=stampAt(i)&&t<dayStart(i)+DAYLEN+.35){st=i;break;} }
  if(st!==stampState){
    if(st>=0){
      const nm=DAYS[st].st; $('stampName').textContent=nm; $('stampName').style.fontSize=(nm.length>8?60:nm.length>6?72:86)+'px';
      $('stampDay').textContent='Day '+(st+1)+' · Apr 2027';
      stampEl.style.setProperty('--sc',INKS[st%3]); stampEl.style.setProperty('--sr',((st%2?1:-1)*(5+st))+'deg');
      stampEl.classList.remove('out','slam'); void stampEl.offsetWidth; stampEl.classList.add('slam');
      setTimeout(()=>{shakeEl.classList.remove('hit');void shakeEl.offsetWidth;shakeEl.classList.add('hit');},140);
    } else if(stampState>=0){ stampEl.classList.remove('slam'); stampEl.classList.add('out'); }
    stampState=st;
  }
  minis.forEach((m,i)=>{const on=t>=stampAt(i)+.2&&t<59.0; if(on!==m.classList.contains('on'))m.classList.toggle('on',on);});
  let ci=-1; NARRATION.forEach(([nt,s],i)=>{ if(t>=nt&&t<Math.min(nt+capDur(s),58.6))ci=i; });
  if(ci!==capShown){ capShown=ci; if(ci>=0){capText.textContent=NARRATION[ci][1];capEl.classList.remove('hide');} else capEl.classList.add('hide'); }
}

let AC=null, master=null, music=null, verb=null, noiseBuf=null, audioBase=0, schedCursor=0, EVENTS=[];
const amb={};
const HIJAZ=[0,1,4,5,7,8,10,12,13,16];
const MOTIFS=[[0,null,1,2,3,null,2,1],[4,null,3,2,1,2,null,0],[0,0,null,4,5,4,3,null],[2,3,4,null,6,5,4,2],[7,null,6,5,4,null,5,4],[3,2,1,null,0,null,null,null]];
const MSEQ=[0,1,2,3,4,3,1,5];
const MAQ=['D','T',null,'T','D',null,'T',null];
const NEY=[[0.3,4,2.2],[2.6,3,1.4],[15.4,7,2.0],[17.6,5,2.2],[32.2,4,1.8],[34.2,7,2.6],[44.0,5,2.0],[46.2,4,2.4],[OUTRO,7,2.0],[56.6,4,1.6]];
function buildEvents(){
  const ev=[], E=(t,f,...a)=>ev.push({t,f,a});
  E(0,'bell',0); E(.2,'bell',7); E(.95,'whoosh',1.6); E(2.75,'boom');
  for(let b=0;b<25;b++){
    for(let e=0;e<8;e++){
      const t=b*2.4+e*.3;
      if(t>=4&&t<OUTRO){
        if(MAQ[e]==='D')E(t,'dum',t<9.6?.6:1); if(MAQ[e]==='T')E(t,'tek',t<9.6?.5:1);
        if(t>=9.6)E(t+.15,'shk',e%2?.55:1);
        if(e===0)E(t,'bass',73.42*Math.pow(2,[0,0,5,7][b%4]/12));
        const deg=MOTIFS[MSEQ[b%8]][e];
        if(deg!==null && t>=4.8)E(t,'pluck',293.66*Math.pow(2,HIJAZ[deg]/12)*(t<9.6?.5:1), t<9.6?.6:1);
      }
      if(t>=OUTRO&&t<58.4){ if(e===0){E(t,'dum',.9);E(t,'bass',73.42);} if(e===4)E(t,'tek',.6); }
    }
  }
  for(const [t,deg,dur] of NEY)E(t,'ney',293.66*Math.pow(2,HIJAZ[deg]/12),dur);
  for(let i=0;i<9;i++){ E(dayStart(i)-.35,'whoosh',1.0); E(stampAt(i)+.12,'stamp'); }
  E(OUTRO-.35,'whoosh',1.0);
  E(dayStart(4)+.3,'rumble',3.8); E(dayStart(8)+.5,'rumble',4.0);
  E(32.6,'whoosh',1.4); E(34.0,'burner'); E(OUTRO,'bell',0); E(OUTRO+.25,'bell',4); E(58.4,'boom');
  NARRATION.forEach(([t,s],i)=>E(t,'say',s,i));
  return ev.sort((a,b)=>a.t-b.t);
}

  const horizon=elapsed+.3;
  for(let li=Math.floor(schedCursor/LOOP);li<=Math.floor(horizon/LOOP);li++){
    for(const e of EVENTS){const T=li*LOOP+e.t; if(T>=schedCursor&&T<horizon){ try{SFX[e.f](audioBase+T,...e.a);}catch(err){} }}
  }
  schedCursor=horizon;
  const a=ambienceAt(t), now=AC.currentTime;
  amb.wind.g.gain.setTargetAtTime(a.wind*.22,now,.5); amb.water.g.gain.setTargetAtTime(a.wat*.22,now,.5); amb.market.g.gain.setTargetAtTime(a.mkt*.16,now,.5);
}

/* ---------- main loop ---------- */
let t0=performance.now(), last=t0;
function restart(){ t0=performance.now(); last=t0; shownPhase=null; stampState=-1; capShown=-1; if(AC){audioBase=AC.currentTime+.06; schedCursor=0;} if('speechSynthesis' in window)speechSynthesis.cancel(); }
const soundBtn=$('sound');
soundBtn.addEventListener('click',async e=>{
  e.stopPropagation();
  try{ if(!AC)initAudio(); await AC.resume(); soundBtn.textContent='Loading narration…'; await loadVO(); }catch(err){ console.warn('Audio unavailable',err); }
  if('speechSynthesis' in window){ const warm=new SpeechSynthesisUtterance(' '); warm.volume=0; speechSynthesis.speak(warm); }
  soundBtn.hidden=true; restart();
});
addEventListener('keydown',e=>{ if(e.key==='m'&&master)master.gain.value=master.gain.value>0?0:.85; if(e.key==='r')restart(); });
stage.addEventListener('click',restart);

const _fw=new THREE.Vector3(), _rt=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0), _show=new THREE.Color();
const PINS=[[1.0,-5.3],[-2.6,-7.2],[-3.4,-11.0],[5.15,-8.7],[2.7,3.2],[-3.6,1.6],[2.6,8.4],[0.5,11.6]];
function frame(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  const elapsed=(now-t0)/1000, t=elapsed%LOOP;
  const Lt=lightAt(t);

  scene.background.copy(Lt.bg); scene.fog.color.copy(Lt.bg);
  hemi.color.copy(Lt.sky); hemi.groundColor.copy(Lt.gnd); hemi.intensity=Lt.hI;
  sun.color.copy(Lt.sunC); sun.intensity=Lt.sI;
  sun.position.set(Math.cos(Lt.el)*Math.sin(Lt.az)*32,Math.sin(Lt.el)*32+2,Math.cos(Lt.el)*Math.cos(Lt.az)*32);
  renderer.toneMappingExposure=Lt.exp;
  for(const g of glowMats)g.m.emissiveIntensity=g.k*(.08+Lt.night*.92);
  ORANGE.emissiveIntensity=.25+Lt.night*.8;
  stars.material.opacity=Lt.night*.9;
  WATER.color.setHex(C.teal).lerp(_c1.setHex(0x0f3d5c),Lt.night*.6);
  SEA.color.setHex(C.royal).lerp(_c1.setHex(0x14215a),Lt.night*.6);
  stage.style.background='#'+Lt.bg.getHexString();
  sunglow.style.opacity=(Lt.gold*(1-Lt.night)*.85).toFixed(3);

  const showK=smooth(clamp((t-OUTRO-.4)/.8))*(1-smooth(clamp((t-58.2)/.6)));
  const day1K=(t>dayStart(0)&&t<dayStart(1))?Lt.night:0;
  _show.setHSL(((t*.18)%1),.75,.55);
  for(const m of PYR){ m.emissive.setRGB(1,.72,.35).multiplyScalar(day1K*.22).lerp(_show,showK*.9); m.emissiveIntensity=1; }
  beams.forEach((b,i)=>{
    if(b===capBeam){b.material.opacity=Math.max(day1K*.18,showK*.32,t<2.2?(1-t/2.2)*.25:0);b.scale.set(1+Math.sin(t*3)*.05,1,1+Math.sin(t*3)*.05);}
    else{b.material.opacity=showK*.16;b.rotation.set(Math.sin(t*.9+i)*.55,0,Math.cos(t*.7+i*1.3)*.55);}
    b.visible=b.material.opacity>.005;
  });

  for(const p of props){
    let s;
    if(p.keep) s=1;
    else if(t<3.2) s=outBack(clamp((t-p.delay)/.5));
    else if(t>58.3) s=1-smooth(clamp((t-58.3-(1.2-p.delay)*.45)/.6));
    else s=1;
    p.g.visible=s>0.002; p.g.scale.setScalar(Math.max(s,0.002)); p.g.position.y=(1-Math.min(s,1))*-1.6;
  }
  const sinkAll = t>58.3 ? 1-smooth(clamp((t-58.5)/.6)) : 1;
  for(const d of trailDots){ const s=t<d.at?0:outBack(clamp((t-d.at)/.35))*sinkAll; d.m.visible=s>0.01; d.m.scale.setScalar(Math.max(s,0.01)); }
  for(const a of anims)a(t,Lt);

  const pourOn=t<2.4; sandPour.visible=pourOn;
  if(pourOn){for(let i=0;i<SAND_N;i++){const [x,z,dl,h]=sandSeed[i];const u=clamp((t-dl)/.9);sandPos[i*3]=x;sandPos[i*3+1]=u>=1?-50:h*(1-u*u);sandPos[i*3+2]=z;} sandGeo.attributes.position.needsUpdate=true;
    sandPour.material.opacity=.9*(1-clamp((t-1.6)/.8));}
  for(let i=0;i<DUST_N;i++){const [x,y,z,sp]=dustSeed[i];dustPos[i*3]=((x+t*sp+8)%16+16)%16-8;dustPos[i*3+1]=y+Math.sin(t*.8+i)*.15;dustPos[i*3+2]=z+Math.sin(t*.3+i)*.3;}
  dustGeo.attributes.position.needsUpdate=true; dust.material.opacity=.55*(1-Lt.night)*sinkAll;

  const fu=(t/22)%1, fz=13-fu*26; flock.position.set(riverX(fz)+Math.sin(t*.4)*.8,3.4+Math.sin(t*.9)*.3,fz); flock.rotation.y=Math.PI;
  flock.visible=Lt.night<.6 && t>3 && t<58;
  birds.forEach(b=>{const f=Math.sin(t*14+b.ph)*.6;b.wl.rotation.z=f;b.wr.rotation.z=-f;});

  const day=t>=DAY0&&t<OUTRO?Math.floor((t-DAY0)/DAYLEN):-1, c=camAt(t);
  if(day>=0&&day<8){const local=t-dayStart(day),s=outBack(clamp((local-.9)/.4))*(1-smooth(clamp((local-DAYLEN+1.3)/.35)));
    pin.visible=s>0.01; pin.scale.setScalar(Math.max(s,.01)); pin.position.set(PINS[day][0],2.0+Math.sin(t*3)*.15,PINS[day][1]); pin.rotation.y=t*1.2;}
  else pin.visible=false;

  const fl=(s,from,to,peak)=>{const u=clamp((t-s)/3.6);return {u,x:lerp(from[0],to[0],smooth(u)),z:lerp(from[1],to[1],smooth(u)),y:.25+Math.sin(Math.PI*u)*peak};};
  let pf=null, heading=Math.PI;
  if(t>dayStart(4)+.2&&t<dayStart(4)+4.2){pf=fl(dayStart(4)+.4,[5.9,-2.6],[5.8,3.4],3.2);heading=Math.PI;}
  if(t>dayStart(8)+.2&&t<dayStart(8)+4.6){pf=fl(dayStart(8)+.5,[6.25,10.6],[5.9,-1.0],4.4);heading=0;}
  if(pf&&pf.u<1){plane.visible=true;plane.position.set(pf.x,pf.y,pf.z);plane.rotation.set(0,heading,0);plane.rotateX(Math.cos(Math.PI*pf.u)*.22);plane.rotateZ(Math.sin(t*2)*.08);plane.scale.setScalar(1.25);}
  else plane.visible=false;
  updateTrail(t);

  if(t>dayStart(6)&&t<dayStart(8)){const p=pathPoint(ROAD,smooth(clamp((t-dayStart(6)-.4)/4.2)));bus.visible=true;bus.position.set(p.x,.03,p.z);bus.rotation.y=p.a+Math.PI;}
  else bus.visible=false;

  const az=-.42+.36*Math.sin(t*2*Math.PI/LOOP);
  camera.position.set(c.x+Math.sin(az)*Math.cos(c.e)*c.d, c.y+Math.sin(c.e)*c.d, c.z+Math.cos(az)*Math.cos(c.e)*c.d);
  camera.lookAt(c.x,c.y,c.z);

  const fbU=(t-33.7)/2.6;
  if(fbU>0&&fbU<1){
    camera.getWorldDirection(_fw); _rt.crossVectors(_fw,_up).normalize();
    flyBalloon.visible=true;
    flyBalloon.position.copy(camera.position).addScaledVector(_fw,3.4).addScaledVector(_rt,lerp(-2.6,2.4,fbU)).addScaledVector(_up,lerp(-2.0,.6,fbU));
    flyBalloon.scale.setScalar(1.6);
  } else flyBalloon.visible=false;

  const flareK = t<2.6 ? 1-smooth(clamp((t-1.2)/1.4)) : t>59 ? smooth(clamp((t-59)/1)) : .18*(1-Lt.night);
  _proj.copy(capTop).project(camera);
  flareEl.style.transform=`translate(${(_proj.x*.5+.5)*W}px,${(-_proj.y*.5+.5)*H}px) scale(${.35+flareK*1.1+Math.sin(t*5)*.06*flareK}) rotate(${t*8}deg)`;
  flareEl.style.opacity=(_proj.z<1?flareK:0).toFixed(3);

  if(hTilt){const k=(5+clamp((30-c.d)/26)*5);hTilt.uniforms.h.value=k/W;vTilt.uniforms.v.value=k/H;}
  if(haze){haze.uniforms.time.value=t;haze.uniforms.amount.value=.0011*(1-Lt.night)*clamp((Lt.el-.6)/.35)*(day===1||day===5||day<0?1:.45);}

  overlay(t,dt);
  drawGust(t);
  scheduleAudio(elapsed,t);
  if(composer){composer.render();}else{renderer.render(scene,camera);}
  renderer.autoClear=false; renderer.render(fxScene,camera); renderer.autoClear=true;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
